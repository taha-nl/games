[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "space-mission"
version = "0.1.0"
description = "Gamified coding competition platform for kids bootcamp"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.50",
    "jinja2==3.1.6",
    "python-multipart==0.0.9",
    "passlib[bcrypt]==1.7.4",
    "itsdangerous==2.2.0",
    "starlette==0.37.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
