{% extends "base.html" %}
{% block title %}Mission Control Login{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <div class="text-center mb-10">
      <div class="text-8xl mb-4 inline-block">🛸</div>
      <h1 class="text-4xl font-black text-white">MISSION CONTROL</h1>
      <p class="text-neon-purple mt-2 tracking-widest text-sm uppercase">Tutor / Admin Access</p>
    </div>

    <div class="glass rounded-2xl p-8 border border-purple-500/30">
      {% if error %}
      <div class="bg-red-900/50 border border-red-500 rounded-lg p-3 mb-5 text-red-300 text-sm flex items-center gap-2">
        <span>⚠️</span> {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/tutor/login" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-1.5">Username</label>
          <input type="text" name="username" required placeholder="admin or tutor"
            class="w-full bg-space-700 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-500
                   focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-1.5">Password</label>
          <input type="password" name="password" required
            class="w-full bg-space-700 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-500
                   focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition">
        </div>
        <button type="submit"
          class="w-full bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-600 hover:to-indigo-600
                 text-white font-bold py-3.5 rounded-xl transition-all duration-200 text-lg active:scale-95">
          🛸 Enter Mission Control
        </button>
      </form>

      <div class="mt-4 text-center">
        <a href="/login" class="text-xs text-gray-500 hover:text-gray-300 transition">← Back to Team Login</a>
      </div>
    </div>

    <div class="mt-4 text-center text-xs text-gray-600">
      Admin: <span class="text-gray-500">admin / admin123</span> · Tutor: <span class="text-gray-500">tutor / tutor123</span>
    </div>
  </div>
</div>
{% endblock %}
